name: Web PWA
on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ink-and-quill-web-dist
          path: web/dist/
